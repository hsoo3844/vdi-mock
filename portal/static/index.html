<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDI 포털 (mock)</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2f6fed; --ok:#16a34a; --warn:#d97706; --err:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:880px; margin:24px auto; padding:0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px; }
  h2 { font-size:15px; margin:0 0 14px; }
  .os { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .os button { text-align:left; padding:16px; border:1px solid var(--line); border-radius:8px; background:#fafbfc; cursor:pointer; font-size:14px; }
  .os button:hover { border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  .st { font-weight:600; }
  .READY { color:var(--ok); } .CREATING, .DELETING { color:var(--warn); } .ERROR { color:var(--err); }
  a.act { text-decoration:none; color:var(--fg); font-size:13px; }
  button.act, a.act { padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-right:6px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  input { padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  #msg { color:var(--err); font-size:13px; min-height:18px; margin-top:8px; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><h1>VDI 셀프서비스 포털 <span class="muted">mock · K8s backend</span></h1><div id="who"></div></header>
<main>
  <section id="login">
    <h2>로그인</h2>
    <input id="username" placeholder="사용자 이름 (영문/숫자)">
    <button class="act primary" onclick="login()">로그인</button>
    <div class="muted">목업이라 비밀번호 없이 이름만으로 로그인합니다 (처음 쓰는 이름은 자동 가입, 관리자는 <b>admin</b>).</div>
  </section>
  <div id="app" hidden>
    <section>
      <h2>OS 선택 → 데스크톱 생성</h2>
      <div class="os" id="images"></div>
      <div id="msg"></div>
    </section>
    <section>
      <h2>내 데스크톱</h2>
      <table><thead><tr><th>ID</th><th>OS</th><th>상태</th><th>노드</th><th></th></tr></thead><tbody id="list"></tbody></table>
    </section>
  </div>
</main>
<script>
let token = localStorage.getItem('vdiToken'), user = localStorage.getItem('vdiUser');
const msg = t => document.getElementById('msg').textContent = t || '';

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type':'application/json', Authorization:'Bearer '+token }, body: body && JSON.stringify(body) });
  if (r.status === 401) { logout(); throw new Error('login required'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}

async function login() {
  const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: document.getElementById('username').value }) });
  const d = await r.json();
  if (!r.ok) return alert(d.detail);
  if (d.role === 'admin' && confirm('관리자 계정입니다. 관리자 페이지로 이동할까요?')) {
    localStorage.setItem('vdiToken', d.token); localStorage.setItem('vdiUser', d.username);
    return location.href = '/admin';
  }
  token = d.token; user = d.username;
  localStorage.setItem('vdiToken', token); localStorage.setItem('vdiUser', user);
  show();
}
function logout() { localStorage.clear(); token = user = null; show(); }

async function show() {
  document.getElementById('login').hidden = !!token;
  document.getElementById('app').hidden = !token;
  document.getElementById('who').innerHTML = '';
  if (!token) return;
  const me = await api('GET', '/api/me');
  document.getElementById('who').innerHTML = `${me.username} <span class="muted">(${me.role}, 할당량 ${me.quota})</span> `
    + (me.role === 'admin' ? '<a class="act" href="/admin">관리자 페이지</a> ' : '')
    + '<button class="act" onclick="logout()">로그아웃</button>';
  const images = await api('GET', '/api/images');
  document.getElementById('images').innerHTML = images.map(i => `<button onclick="create('${i.id}')"><b>${i.name}</b><div class="muted">${i.id}</div></button>`).join('');
  refresh();
}

async function create(os) {
  msg();
  try { await api('POST', '/api/desktops', { os }); refresh(); } catch (e) { msg(e.message); }
}
async function connect(id) {
  try { const d = await api('POST', `/api/desktops/${id}/connect`); window.open(d.url, '_blank'); } catch (e) { msg(e.message); }
}
async function remove(id) {
  if (!confirm('데스크톱을 반납할까요?')) return;
  try { await api('DELETE', `/api/desktops/${id}`); refresh(); } catch (e) { msg(e.message); }
}

async function refresh() {
  if (!token) return;
  const list = await api('GET', '/api/desktops');
  document.getElementById('list').innerHTML = list.length ? list.map(d => `<tr>
      <td>${d.id}</td><td>${d.os_name}</td><td class="st ${d.status}">${d.status}</td><td>${d.node || '-'}</td>
      <td><button class="act primary" onclick="connect('${d.id}')" ${d.status !== 'READY' ? 'disabled' : ''}>접속</button>
          <button class="act" onclick="remove('${d.id}')" ${d.status === 'DELETING' ? 'disabled' : ''}>반납</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="muted">데스크톱이 없습니다.</td></tr>';
}

setInterval(refresh, 3000);
show();
</script>
</body>
</html>
