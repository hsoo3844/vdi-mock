<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDI Cloud</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  /* ---------------- login */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; }
  .login-hero {
    position: relative; overflow: hidden; color: #fff; padding: 48px 56px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: linear-gradient(150deg, #1e1b4b 0%, #312e81 45%, #0e7490 100%);
  }
  .login-hero::before, .login-hero::after {
    content: ""; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55;
  }
  .login-hero::before { width: 420px; height: 420px; background: #7c3aed; top: -120px; right: -80px; }
  .login-hero::after { width: 360px; height: 360px; background: #06b6d4; bottom: -140px; left: -60px; }
  .login-hero > * { position: relative; z-index: 1; }
  .login-hero .brand { color: #fff; }
  .login-hero .brand .tag { background: rgba(255, 255, 255, .14); color: #e0e7ff; }
  .hero-copy h1 { font-size: clamp(30px, 3.4vw, 44px); line-height: 1.15; margin: 0 0 14px; letter-spacing: -.03em; }
  .hero-copy h1 span { background: linear-gradient(90deg, #a5b4fc, #67e8f9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-copy p { color: #c7d2fe; font-size: 16px; max-width: 440px; margin: 0; }
  .hero-flow { display: flex; gap: 10px; flex-wrap: wrap; }
  .hero-flow div {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); backdrop-filter: blur(8px);
    font-size: 13px; font-weight: 600; color: #e0e7ff;
  }
  .hero-flow b { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: rgba(255, 255, 255, .18); font-size: 12px; }
  .login-side { display: grid; place-items: center; padding: 32px 20px; }
  .login-card { width: min(400px, 100%); padding: 36px 32px; }
  .login-card h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .login-card > p { margin: 0 0 26px; color: var(--muted); }
  .login-card form { display: grid; gap: 14px; }
  .login-hint { margin-top: 22px; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line-strong); font-size: 13px; color: var(--fg-2); display: flex; gap: 10px; }
  .login-hint svg { width: 18px; height: 18px; flex: none; color: var(--accent); margin-top: 1px; }
  .login-hint code { font-family: var(--mono); background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 5px; }

  /* ---------------- app shell */
  .topbar {
    position: sticky; top: 0; z-index: 20; height: 64px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: color-mix(in srgb, var(--surface) 78%, transparent); backdrop-filter: saturate(1.4) blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .user-chip { display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
  .user-chip b { font-size: 13.5px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 32px 28px 64px; }

  .welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
  .welcome h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.03em; }
  .welcome p { margin: 0; color: var(--muted); }
  .quota { min-width: 260px; padding: 16px 18px; }
  .quota-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .quota-top span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .quota-top b { font-size: 20px; letter-spacing: -.02em; }
  .quota-top b small { font-size: 13px; color: var(--muted); font-weight: 600; }
  .meter { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; display: flex; gap: 3px; }
  .meter i { flex: 1; border-radius: 99px; background: var(--surface-3); transition: background .3s; }
  .meter i.on { background: var(--grad); }
  .meter i.full { background: var(--warn); }

  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 36px 0 14px; }
  .section-head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .section-head h2 .count { font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--surface-3); color: var(--muted); }

  /* ---------------- os catalog */
  .os-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .os-card {
    position: relative; text-align: left; padding: 20px; cursor: pointer; overflow: hidden;
    transition: transform .15s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .os-card::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s;
    background: radial-gradient(400px 160px at 100% 0%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%);
  }
  .os-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .os-card:hover::after { opacity: 1; }
  .os-card:focus-visible { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
  .os-card:disabled { cursor: not-allowed; opacity: .55; transform: none; box-shadow: var(--shadow); }
  .os-card .row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .os-icon { display: grid; place-items: center; border-radius: 12px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .os-icon svg { width: 55%; height: 55%; }
  .os-card h3 { margin: 0 0 4px; font-size: 16px; letter-spacing: -.02em; }
  .os-card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; min-height: 39px; }
  .os-card .specs { display: flex; gap: 12px; font-size: 12px; color: var(--fg-2); font-weight: 600; }
  .os-card .specs span { display: flex; align-items: center; gap: 5px; }
  .os-card .specs svg { width: 14px; height: 14px; color: var(--muted); }
  .os-card .cta {
    position: absolute; right: 18px; bottom: 18px; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; background: var(--c); color: #fff; transform: scale(.85); opacity: 0; transition: all .2s ease;
  }
  .os-card .cta svg { width: 18px; height: 18px; }
  .os-card:hover .cta { opacity: 1; transform: scale(1); }
  .badge-de { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }

  /* ---------------- desktops */
  .desk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .desk { padding: 20px; display: flex; flex-direction: column; gap: 18px; animation: pop .25s ease; }
  .desk.READY { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
  .desk-head { display: flex; align-items: center; gap: 14px; }
  .desk-head .meta { flex: 1; min-width: 0; }
  .desk-head h3 { margin: 0; font-size: 15.5px; letter-spacing: -.02em; }
  .desk-head .sub { color: var(--muted); font-size: 12.5px; }
  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .step { display: flex; flex-direction: column; gap: 7px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .step i { height: 5px; border-radius: 99px; background: var(--surface-3); position: relative; overflow: hidden; }
  .step.done i { background: var(--accent); }
  .step.now { color: var(--fg); }
  .step.now i::after { content: ""; position: absolute; inset: 0; width: 45%; background: var(--grad); border-radius: 99px; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
  .steps-foot { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-top: -8px; }
  .steps-foot b { font-family: var(--mono); color: var(--fg-2); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .fact span { display: block; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .fact b { font-size: 13px; }
  .desk-actions { display: flex; gap: 8px; }
  .desk-actions .btn-connect { flex: 1; }
  .empty-card { padding: 8px; border-style: dashed; box-shadow: none; background: transparent; }

  @media (max-width: 880px) {
    .login { grid-template-columns: 1fr; }
    .login-hero { padding: 32px 24px; min-height: 280px; gap: 24px; }
    .topbar { padding: 0 16px; }
    .wrap { padding: 24px 16px 48px; }
    .user-chip b, .topbar .hide-sm { display: none; }
    .desk-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ============================ login -->
<div class="login" id="login-view" hidden>
  <div class="login-hero">
    <div class="brand"><span class="brand-mark"><span data-icon="logo"></span></span>VDI Cloud <span class="tag">mock</span></div>
    <div class="hero-copy">
      <h1>OS를 고르면,<br><span>브라우저가 곧 데스크톱</span></h1>
      <p>설치 없이 웹에서 바로 쓰는 셀프서비스 가상 데스크톱. 필요할 때 만들고, 다 쓰면 반납하세요.</p>
    </div>
    <div class="hero-flow">
      <div><b>1</b>OS 선택</div><div><b>2</b>자동 생성</div><div><b>3</b>브라우저로 접속</div>
    </div>
  </div>
  <div class="login-side">
    <div class="login-card card">
      <h2>시작하기</h2>
      <p>이름을 입력하면 바로 로그인됩니다.</p>
      <form id="login-form">
        <div class="field">
          <label for="username">사용자 이름</label>
          <input class="input input-lg" id="username" placeholder="예: hsoo" autocomplete="username" autofocus required>
        </div>
        <button class="btn btn-grad btn-lg" id="login-btn">로그인 <span data-icon="arrow"></span></button>
      </form>
      <div class="login-hint"><span data-icon="info"></span><div>목업이라 비밀번호가 없어요. 처음 쓰는 이름은 자동 가입되고, <code>admin</code>은 관리자 계정입니다.</div></div>
    </div>
  </div>
</div>

<!-- ============================ app -->
<div id="app-view" hidden>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark"><span data-icon="logo"></span></span>VDI Cloud <span class="tag">mock</span></a>
    <div class="topbar-right">
      <a class="btn btn-ghost" id="admin-link" href="/admin" hidden><span data-icon="shield"></span><span class="hide-sm">관리자</span></a>
      <div class="user-chip" id="user-chip"></div>
      <button class="btn btn-ghost btn-icon" id="logout" title="로그아웃" aria-label="로그아웃"><span data-icon="logout"></span></button>
    </div>
  </header>

  <main class="wrap">
    <div class="welcome">
      <div>
        <h1 id="hello">안녕하세요</h1>
        <p>원하는 OS를 고르면 전용 데스크톱이 준비됩니다. 보통 15초면 충분해요.</p>
      </div>
      <div class="quota card">
        <div class="quota-top"><span>사용 중인 데스크톱</span><b id="quota-num">-</b></div>
        <div class="meter" id="quota-meter"></div>
      </div>
    </div>

    <div class="section-head"><h2>새 데스크톱</h2></div>
    <div class="os-grid" id="os-grid">
      <div class="skeleton" style="height:190px"></div><div class="skeleton" style="height:190px"></div><div class="skeleton" style="height:190px"></div>
    </div>

    <div class="section-head"><h2>내 데스크톱 <span class="count" id="desk-count">0</span></h2></div>
    <div class="desk-grid" id="desk-grid"></div>
  </main>
</div>

<script src="/static/common.js"></script>
<script>
hydrateIcons();

const STAGES = [['scheduling', '노드 배치'], ['pulling', '이미지 준비'], ['booting', 'RDP 부팅'], ['ready', '준비 완료']];
let me = null, images = [], desktops = [], timer = null;

function showLogin() {
  $('#login-view').hidden = false; $('#app-view').hidden = true;
  clearInterval(timer); setTimeout(() => $('#username')?.focus(), 0);
}

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  await busy($('#login-btn'), async () => {
    try {
      const d = await api('POST', '/api/auth/login', { username: $('#username').value });
      auth.set(d.token, d.username);
      if (d.role === 'admin' && await modal({ title: '관리자 계정입니다', body: '관리자 페이지로 이동할까요? 포털에 머물러도 데스크톱을 만들 수 있어요.', confirm: '관리자 페이지로' })) {
        location.href = '/admin'; return;
      }
      start();
    } catch (err) { toast(humanError(err), 'err'); }
  });
});

$('#logout').onclick = () => { auth.clear(); showLogin(); };
document.addEventListener('unauthorized', showLogin);

async function start() {
  if (!auth.token) return showLogin();
  try {
    [me, images] = await Promise.all([api('GET', '/api/me'), api('GET', '/api/images')]);
  } catch { return; }
  $('#login-view').hidden = true; $('#app-view').hidden = false;
  $('#hello').textContent = `안녕하세요, ${me.username} 님`;
  $('#user-chip').innerHTML = `${avatar(me.username, 28)}<b>${esc(me.username)}</b>${me.role === 'admin' ? '<span class="pill admin">admin</span>' : ''}`;
  $('#admin-link').hidden = me.role !== 'admin';
  await refresh();
  clearInterval(timer); timer = setInterval(refresh, 2500);
}

function renderOs() {
  const used = desktops.filter(d => d.status !== 'DELETING').length, full = used >= me.quota;
  $('#os-grid').innerHTML = images.map(i => {
    const s = osStyle(i.id);
    return `<button class="os-card card" style="--c:${s.color}" data-os="${i.id}" ${full ? 'disabled title="할당량을 모두 사용했어요"' : ''}>
      <div class="row">${osIcon(i.id)}<span class="badge-de">${s.badge}</span></div>
      <h3>${esc(i.name)}</h3><p>${esc(i.desc || s.note)}</p>
      <div class="specs"><span>${ICON.cpu}xrdp · RDP</span><span>${ICON.clock}~15초</span></div>
      <span class="cta">${ICON.plus}</span></button>`;
  }).join('');
  $$('.os-card').forEach(b => b.onclick = () => create(b.dataset.os, b));
}

function renderQuota() {
  const used = desktops.filter(d => d.status !== 'DELETING').length, q = Math.max(me.quota, 1);
  $('#quota-num').innerHTML = `${used}<small> / ${me.quota}</small>`;
  $('#quota-meter').innerHTML = Array.from({ length: q }, (_, i) => `<i class="${i < used ? (used >= me.quota ? 'on full' : 'on') : ''}"></i>`).join('');
}

function deskCard(d) {
  const s = osStyle(d.os);
  let body;
  if (d.status === 'CREATING') {
    const idx = STAGES.findIndex(([k]) => k === d.stage);
    body = `<div class="steps">${STAGES.map(([k, label], i) => `<div class="step ${i < idx ? 'done' : i === idx ? 'now' : ''}"><i></i>${label}</div>`).join('')}</div>
      <div class="steps-foot"><span>${STAGES[Math.max(idx, 0)][1]} 중…</span><b data-elapsed="${d.created_at}">${elapsed(d.created_at)}</b></div>`;
  } else {
    body = `<div class="facts">
      <div class="fact"><span>노드</span><b>${esc(d.node || '-')}</b></div>
      <div class="fact"><span>프로토콜</span><b>RDP</b></div>
      <div class="fact"><span>생성</span><b>${timeAgo(d.created_at)}</b></div></div>`;
  }
  return `<article class="desk card ${d.status}" style="--c:${s.color}">
    <div class="desk-head">${osIcon(d.os, 44)}<div class="meta"><h3>${esc(d.os_name)}</h3><div class="sub mono">${d.id}</div></div>${statusPill(d.status)}</div>
    ${body}
    <div class="desk-actions">
      <button class="btn btn-primary btn-connect" data-connect="${d.id}" ${d.status !== 'READY' ? 'disabled' : ''}>${ICON.play}접속</button>
      <button class="btn btn-danger" data-remove="${d.id}" ${d.status === 'DELETING' ? 'disabled' : ''}>${ICON.trash}반납</button>
    </div></article>`;
}

function renderDesks() {
  $('#desk-count').textContent = desktops.length;
  $('#desk-grid').innerHTML = desktops.length ? desktops.map(deskCard).join('')
    : `<div class="card empty-card" style="grid-column:1/-1"><div class="empty">${ICON.empty}<b>아직 데스크톱이 없어요</b>위에서 OS를 골라 첫 데스크톱을 만들어 보세요.</div></div>`;
  $$('[data-connect]').forEach(b => b.onclick = () => connect(b.dataset.connect, b));
  $$('[data-remove]').forEach(b => b.onclick = () => remove(b.dataset.remove));
}

async function refresh() {
  try {
    const list = await api('GET', '/api/desktops');
    const prev = Object.fromEntries(desktops.map(d => [d.id, d.status]));
    list.sort((a, b) => b.created_at.localeCompare(a.created_at));
    for (const d of list) if (prev[d.id] === 'CREATING' && d.status === 'READY') toast(`${d.os_name} 데스크톱이 준비됐어요`);
    desktops = list;
    renderQuota(); renderOs(); renderDesks();
  } catch {}
}
setInterval(() => $$('[data-elapsed]').forEach(el => el.textContent = elapsed(el.dataset.elapsed)), 1000);

async function create(os, btn) {
  await busy(btn, async () => {
    try {
      await api('POST', '/api/desktops', { os });
      toast('데스크톱을 만들고 있어요', 'info');
      await refresh();
    } catch (e) { toast(humanError(e), 'err'); }
  });
}

// Guacamole는 브라우저에 남은 세션 토큰이 있으면 새 ?data= 를 무시하고 그 세션을 재사용한다.
// (예전 데스크톱만 든 세션 → 빈 "모든 연결" 화면) 같은 origin이므로 접속 전에 로그아웃·삭제한다.
async function resetGuacamoleSession() {
  let token = null;
  try { token = JSON.parse(localStorage.getItem('GUAC_AUTH_TOKEN')); } catch {}
  if (token) await fetch(`/guacamole/api/tokens/${encodeURIComponent(token)}`, { method: 'DELETE' }).catch(() => {});
  try { localStorage.removeItem('GUAC_AUTH_TOKEN'); } catch {}
}

async function connect(id, btn) {
  const win = window.open('about:blank', '_blank');  // 팝업 차단 회피: 클릭 시점에 먼저 연다
  await busy(btn, async () => {
    try {
      const [d] = await Promise.all([api('POST', `/api/desktops/${id}/connect`), resetGuacamoleSession()]);
      if (win) win.location = d.url; else location.href = d.url;
    } catch (e) { win?.close(); toast(humanError(e), 'err'); }
  });
}

async function remove(id) {
  const d = desktops.find(x => x.id === id);
  const ok = await modal({ title: '데스크톱을 반납할까요?', body: `<b>${esc(d?.os_name)}</b> <span class="mono">${id}</span>의 작업 내용은 모두 삭제되며 되돌릴 수 없어요.`, confirm: '반납하기', danger: true });
  if (!ok) return;
  try { await api('DELETE', `/api/desktops/${id}`); toast('반납을 요청했어요'); refresh(); } catch (e) { toast(humanError(e), 'err'); }
}

start();
</script>
</body>
</html>
