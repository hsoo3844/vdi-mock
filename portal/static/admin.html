<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VDI 관리자 (mock)</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2330; --muted:#6b7280; --line:#e3e6eb; --accent:#2f6fed; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --admin:#7c3aed; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
  header { background:#1d2330; color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  header a, header button { color:#fff; }
  nav { background:var(--card); border-bottom:1px solid var(--line); padding:0 24px; display:flex; gap:4px; overflow-x:auto; }
  nav button { border:0; background:none; padding:12px 14px; font-size:14px; cursor:pointer; border-bottom:2px solid transparent; color:var(--muted); }
  nav button.on { color:var(--fg); border-color:var(--accent); font-weight:600; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; overflow-x:auto; }
  h2 { font-size:15px; margin:0 0 12px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:18px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tile .n { font-size:26px; font-weight:700; margin-top:4px; }
  .tile .l { color:var(--muted); font-size:13px; }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; }
  .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; }
  .bar span:first-child { width:120px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bar i { display:block; height:10px; background:var(--accent); border-radius:3px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  .READY { color:var(--ok); font-weight:600; } .CREATING, .DELETING { color:var(--warn); font-weight:600; } .ERROR { color:var(--err); font-weight:600; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; background:#eef0f3; }
  .badge.admin { background:#ede9fe; color:var(--admin); } .badge.off { background:#fee2e2; color:var(--err); }
  button.act { padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:12px; margin-right:4px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--err); border-color:#fecaca; }
  input, select { padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; }
  input.q { width:56px; }
  form.inline { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  #msg { position:fixed; bottom:16px; right:16px; background:#1d2330; color:#fff; padding:10px 14px; border-radius:8px; font-size:13px; display:none; }
  .muted { color:var(--muted); font-size:13px; }
  #login { max-width:420px; margin:60px auto; }
</style>
</head>
<body>
<header><h1>VDI 관리자 <span class="muted">mock</span></h1><div id="who"></div></header>

<section id="login" hidden>
  <h2>관리자 로그인</h2>
  <form class="inline" onsubmit="login(event)">
    <input id="username" value="admin" placeholder="관리자 이름">
    <button class="act primary">로그인</button>
  </form>
  <div class="muted">목업: 이름만 입력하면 됩니다 (기본 관리자 <b>admin</b>).</div>
</section>

<div id="app" hidden>
  <nav>
    <button data-tab="dash" class="on">대시보드</button>
    <button data-tab="users">사용자</button>
    <button data-tab="desktops">데스크톱</button>
    <button data-tab="events">이벤트</button>
  </nav>
  <main>
    <div id="tab-dash">
      <div class="tiles" id="tiles"></div>
      <div class="grid2">
        <section><h2>상태별</h2><div id="by_status"></div></section>
        <section><h2>OS별</h2><div id="by_os"></div></section>
        <section><h2>노드별</h2><div id="by_node"></div></section>
      </div>
    </div>

    <div id="tab-users" hidden>
      <section>
        <h2>사용자 추가</h2>
        <form class="inline" onsubmit="createUser(event)">
          <input id="nu-name" placeholder="이름 (영문/숫자)" required>
          <select id="nu-role"><option value="user">user</option><option value="admin">admin</option></select>
          할당량 <input id="nu-quota" class="q" type="number" min="0" value="2">
          <button class="act primary">추가</button>
        </form>
        <table><thead><tr><th>이름</th><th>역할</th><th>상태</th><th>할당량</th><th>데스크톱</th><th>가입</th><th>최근 로그인</th><th></th></tr></thead>
        <tbody id="users"></tbody></table>
      </section>
    </div>

    <div id="tab-desktops" hidden>
      <section>
        <h2>데스크톱 할당 <span class="muted">(관리자 할당은 할당량 무시)</span></h2>
        <form class="inline" onsubmit="assignDesktop(event)">
          <select id="as-owner"></select>
          <select id="as-os"></select>
          <button class="act primary">할당</button>
          <span class="muted">필터</span>
          <select id="filter-owner" onchange="loadDesktops()"><option value="">전체 사용자</option></select>
        </form>
        <table><thead><tr><th>ID</th><th>소유자</th><th>OS</th><th>상태</th><th>노드</th><th>생성</th><th></th></tr></thead>
        <tbody id="desktops"></tbody></table>
      </section>
    </div>

    <div id="tab-events" hidden>
      <section>
        <h2>이벤트 로그 <span class="muted">최근 200건</span></h2>
        <table><thead><tr><th>시각</th><th>수행자</th><th>동작</th><th>대상</th><th>상세</th></tr></thead>
        <tbody id="events"></tbody></table>
      </section>
    </div>
  </main>
</div>
<div id="msg"></div>

<script>
let token = localStorage.getItem('vdiToken');
let tab = 'dash', me = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => t ? new Date(t).toLocaleString('ko-KR', { hour12:false }) : '-';
function toast(t) { const m = $('msg'); m.textContent = t; m.style.display = 'block'; clearTimeout(m._t); m._t = setTimeout(() => m.style.display = 'none', 3000); }

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type':'application/json', Authorization:'Bearer '+token }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 403) { showLogin(); throw new Error(data.detail || 'admin only'); }
  if (!r.ok) { toast(data.detail || r.statusText); throw new Error(data.detail); }
  return data;
}

async function login(e) {
  e.preventDefault();
  const r = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: $('username').value }) });
  const d = await r.json();
  if (!r.ok) return toast(d.detail);
  if (d.role !== 'admin') return toast(`${d.username}은(는) 관리자가 아닙니다`);
  token = d.token; localStorage.setItem('vdiToken', token); localStorage.setItem('vdiUser', d.username);
  start();
}
function logout() { localStorage.clear(); token = null; showLogin(); }
function showLogin() { $('login').hidden = false; $('app').hidden = true; $('who').innerHTML = ''; }

async function start() {
  if (!token) return showLogin();
  try { me = await api('GET', '/api/me'); } catch { return; }
  if (me.role !== 'admin') return showLogin();
  $('login').hidden = true; $('app').hidden = false;
  $('who').innerHTML = `${esc(me.username)} · <a href="/">포털</a> · <button class="act" onclick="logout()" style="color:var(--fg)">로그아웃</button>`;
  const images = await api('GET', '/api/images');
  $('as-os').innerHTML = images.map(i => `<option value="${i.id}">${esc(i.name)}</option>`).join('');
  refresh();
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  ['dash','users','desktops','events'].forEach(t => $('tab-'+t).hidden = t !== tab);
  refresh();
});

function bars(obj) {
  const entries = Object.entries(obj), max = Math.max(1, ...entries.map(e => e[1]));
  return entries.length ? entries.map(([k, v]) => `<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i style="width:${v / max * 160}px"></i><b>${v}</b></div>`).join('') : '<div class="muted">없음</div>';
}

async function loadDash() {
  const s = await api('GET', '/api/admin/summary');
  $('tiles').innerHTML = [['사용자', s.users], ['관리자', s.admins], ['비활성', s.disabled], ['데스크톱', s.desktops], ['READY', s.by_status.READY || 0], ['CREATING', s.by_status.CREATING || 0]]
    .map(([l, n]) => `<div class="tile"><div class="l">${l}</div><div class="n">${n}</div></div>`).join('');
  $('by_status').innerHTML = bars(s.by_status); $('by_os').innerHTML = bars(s.by_os); $('by_node').innerHTML = bars(s.by_node);
}

async function loadUsers() {
  const users = await api('GET', '/api/admin/users');
  $('users').innerHTML = users.map(u => `<tr>
    <td><b>${esc(u.username)}</b></td>
    <td><span class="badge ${u.role}">${u.role}</span></td>
    <td>${u.disabled ? '<span class="badge off">비활성</span>' : '<span class="badge">활성</span>'}</td>
    <td><input class="q" type="number" min="0" value="${u.quota}" onchange="updateUser('${u.username}', { quota: +this.value })"></td>
    <td><a href="#" onclick="showUserDesktops('${u.username}');return false">${u.desktops}대</a></td>
    <td>${fmt(u.created_at)}</td><td>${fmt(u.last_login)}</td>
    <td>
      <button class="act" onclick="updateUser('${u.username}', { role: '${u.role === 'admin' ? 'user' : 'admin'}' })">${u.role === 'admin' ? '관리자 해제' : '관리자 지정'}</button>
      <button class="act" onclick="updateUser('${u.username}', { disabled: ${!u.disabled} })">${u.disabled ? '활성화' : '비활성화'}</button>
      <button class="act danger" onclick="deleteUser('${u.username}', ${u.desktops})">삭제</button>
    </td></tr>`).join('');
  const opts = users.map(u => `<option value="${u.username}">${esc(u.username)}</option>`).join('');
  const f = $('filter-owner').value, o = $('as-owner').value;
  $('as-owner').innerHTML = opts; $('filter-owner').innerHTML = '<option value="">전체 사용자</option>' + opts;
  $('filter-owner').value = f; if (o) $('as-owner').value = o;
}

async function loadDesktops() {
  const owner = $('filter-owner').value;
  const list = await api('GET', '/api/admin/desktops' + (owner ? `?owner=${owner}` : ''));
  list.sort((a, b) => b.created_at.localeCompare(a.created_at));
  $('desktops').innerHTML = list.length ? list.map(d => `<tr>
    <td>${d.id}</td><td>${esc(d.owner)}</td><td>${esc(d.os_name)}</td><td class="${d.status}">${d.status}</td><td>${d.node || '-'}</td><td>${fmt(d.created_at)}</td>
    <td><button class="act danger" onclick="reclaim('${d.id}', '${d.owner}')" ${d.status === 'DELETING' ? 'disabled' : ''}>회수</button></td></tr>`).join('')
    : '<tr><td colspan="7" class="muted">데스크톱이 없습니다.</td></tr>';
}

async function loadEvents() {
  const ev = await api('GET', '/api/admin/events?limit=200');
  $('events').innerHTML = ev.map(e => `<tr><td>${fmt(e.at)}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td>${esc(e.target)}</td><td>${esc(e.detail)}</td></tr>`).join('');
}

async function createUser(e) {
  e.preventDefault();
  await api('POST', '/api/admin/users', { username: $('nu-name').value, role: $('nu-role').value, quota: +$('nu-quota').value });
  $('nu-name').value = ''; toast('사용자를 추가했습니다'); refresh();
}
async function updateUser(name, patch) { await api('PATCH', `/api/admin/users/${name}`, patch); toast(`${name} 변경 완료`); refresh(); }
async function deleteUser(name, n) {
  if (!confirm(`${name} 사용자를 삭제할까요?` + (n ? `\n데스크톱 ${n}대도 함께 회수됩니다.` : ''))) return;
  await api('DELETE', `/api/admin/users/${name}`); toast(`${name} 삭제`); refresh();
}
async function assignDesktop(e) {
  e.preventDefault();
  const d = await api('POST', '/api/admin/desktops', { owner: $('as-owner').value, os: $('as-os').value });
  toast(`${d.owner}에게 ${d.id} 할당`); refresh();
}
async function reclaim(id, owner) { if (!confirm(`${owner}의 데스크톱 ${id}를 회수할까요?`)) return; await api('DELETE', `/api/admin/desktops/${id}`); refresh(); }
function showUserDesktops(name) { document.querySelector('nav button[data-tab=desktops]').click(); $('filter-owner').value = name; loadDesktops(); }

async function refresh() {
  if (!token || $('app').hidden) return;
  try {
    if (tab === 'dash') await loadDash();
    if (tab === 'users' || tab === 'desktops') await loadUsers();
    if (tab === 'desktops') await loadDesktops();
    if (tab === 'events') await loadEvents();
  } catch {}
}
setInterval(() => { if (tab !== 'users') refresh(); }, 4000);  // 사용자 탭은 입력 중 덮어쓰지 않도록 자동 갱신 제외
start();
</script>
</body>
</html>
